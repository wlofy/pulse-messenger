<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- matches --page in each mode, so the mobile browser chrome follows the theme -->
    <meta name="theme-color" content="#e8eefc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c1120" media="(prefers-color-scheme: dark)" />
    <title>Pulse</title>
    <!-- The same heartbeat glyph as the in-app logo. This is the pre-boot default;
         App.jsx re-paints it in the chosen accent once React mounts. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234f6ef7'/%3E%3Cstop offset='1' stop-color='%238b7cf6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cg transform='translate(4 4)'%3E%3Cpath d='M2 12h3.5l2.5-7 4.5 14 2.5-7H22' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/g%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Work+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>

    <!-- Liquid Glass: SVG displacement filters that make backdrop-filter actually
         refract the content behind each surface (the "refract what's beneath it"
         effect). Referenced from CSS via backdrop-filter: url(#…). Two strengths:
         a gentle one for big panels, a stronger one for small floating controls. -->
    <svg aria-hidden="true" focusable="false" width="0" height="0"
         style="position:absolute;pointer-events:none">
      <defs>
        <filter id="liquid-glass" x="-35%" y="-35%" width="170%" height="170%"
                color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency="0.008 0.008"
                        numOctaves="2" seed="42" result="noise" />
          <feGaussianBlur in="noise" stdDeviation="2" result="soft" />
          <feDisplacementMap in="SourceGraphic" in2="soft" scale="34"
                             xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <filter id="liquid-glass-strong" x="-40%" y="-40%" width="180%" height="180%"
                color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency="0.012 0.012"
                        numOctaves="2" seed="17" result="noise" />
          <feGaussianBlur in="noise" stdDeviation="1.6" result="soft" />
          <feDisplacementMap in="SourceGraphic" in2="soft" scale="60"
                             xChannelSelector="R" yChannelSelector="G" />
        </filter>
      </defs>
    </svg>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
